name: Weekly Digest Email

on:
  schedule:
    - cron: '17 7 * * 1'  # Mondays 07:17 UTC (GitHub often starts it hours later)
  workflow_dispatch:  # allow manual trigger for testing
    inputs:
      post_to_bluesky:
        description: 'Also share the digest on Bluesky and LinkedIn (via the feed)'
        type: boolean
        default: true

permissions:
  contents: write   # to commit feeds/digest.xml

jobs:
  send_digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas pyzotero requests atproto==0.0.56

      - name: Send weekly digest
        run: python send_digest.py
        env:
          SMTP_SERVER:   ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO:     ${{ secrets.DIGEST_TO }}

      - name: Find the digest on Google Groups
        id: share
        if: ${{ hashFiles('digest_post.json') != '' && (github.event_name == 'schedule' || inputs.post_to_bluesky) }}
        run: python digest_link.py

      - name: Share digest on Bluesky
        if: ${{ steps.share.conclusion == 'success' }}
        continue-on-error: true   # a Bluesky problem shouldn't stop the feed update
        run: python bluesky_posts/bluesky_digest_bot.py
        env:
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}

      - name: Add digest to RSS feed (picked up by Zapier for LinkedIn)
        if: ${{ steps.share.conclusion == 'success' }}
        run: |
          python update_digest_feed.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/digest.xml
          git diff --staged --quiet || (git commit -m "Add weekly digest to feed" && git pull --rebase && git push)
