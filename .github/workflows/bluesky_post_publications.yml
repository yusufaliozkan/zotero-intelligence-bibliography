name: Post publications to Bluesky

on:
  schedule:
    - cron: '7 * * * *'  # Backup: hourly at :07. Main trigger is cron-job.org
  workflow_dispatch:

# Never run two at once (cron-job.org and GitHub's schedule can overlap):
# a second run waits for the first, so nothing is posted twice.
concurrency:
  group: bluesky-publications
  cancel-in-progress: false

jobs:
  post_to_bluesky:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy pyzotero requests beautifulsoup4 grapheme pytz atproto==0.0.56

      - name: Run Python Script
        env:
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: |
          python bluesky_posts/bluesky_publications_bot.py

      - name: Commit updated last_posted.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bluesky_posts/last_posted.json
          git diff --staged --quiet || git commit -m "Update last posted timestamp"
          git pull --rebase && git push